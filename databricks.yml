# Declarative Automation Bundle (DAB) for the WFM training pipelines and dashboard.
#
# Deploy from the workspace: open this Git folder, click the Deployments icon (rocket), choose a target, Deploy.
# Or with the Databricks CLI:  databricks bundle deploy -t dev --var="catalog=<your_catalog>" --profile <profile>
#
# Set `catalog` before deploying: pass --var, or uncomment `variables` under your target below.

bundle:
  name: wfm_training

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the training schema (you need CREATE SCHEMA on it)
  schema:
    description: Schema for the tables, the volume and the model
    default: wfm_training
  model_name:
    description: Registered model name inside the schema
    default: venue_demand_forecaster
  spark_version:
    description: Databricks Runtime ML (LTS) for the job clusters
    default: 18.x-cpu-ml-scala2.13
  node_type_id:
    description: Job cluster machine type for your cloud (e.g. AWS m5d.xlarge, Azure Standard_D4ds_v5, GCP n2-standard-4)
    default: m5d.xlarge
  warehouse_id:
    description: SQL warehouse that runs the dashboard
    lookup:
      warehouse: Serverless Starter Warehouse
  notification_email:
    description: Who gets an email when a run fails
    default: ${workspace.current_user.userName}

  single_node_cluster:
    description: Job cluster for seed data, feature engineering, training and forecasting
    type: complex
    default:
      spark_version: ${var.spark_version}
      node_type_id: ${var.node_type_id}
      num_workers: 0
      data_security_mode: SINGLE_USER
      spark_conf:
        spark.databricks.cluster.profile: singleNode
        spark.master: "local[*, 4]"
      custom_tags:
        ResourceClass: SingleNode
        demo: wfm-training
  optimizer_cluster:
    description: Autoscaling job cluster for the staff schedule optimizer (venues run in parallel on the workers)
    type: complex
    default:
      spark_version: ${var.spark_version}
      node_type_id: ${var.node_type_id}
      autoscale:
        min_workers: 1
        max_workers: 3
      data_security_mode: SINGLE_USER
      custom_tags:
        demo: wfm-training

targets:
  dev:
    default: true
    mode: development
    # variables:
    #   catalog: <your_catalog>

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    # variables:
    #   catalog: <your_catalog>
